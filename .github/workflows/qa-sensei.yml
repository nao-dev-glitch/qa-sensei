name: QA-Sensei Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Get PR Diff & Run QA-Sensei
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # main ブランチとの実際のコード差分（Diff）を取得して環境変数にセット
          git fetch origin main
          export PR_DIFF=$(git diff origin/main...HEAD)

          # QA-Sensei を実行し、結果をファイルに保存（ログのノイズを除去）
          npx tsx test-ai.ts > review_result.txt

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewResult = fs.readFileSync('review_result.txt', 'utf8');

            if (!reviewResult.trim()) {
              console.log("レビュー結果が空のためコメントをスキップします。");
              return;
            }

            const body = `### 🤖 QA-Sensei による自動レビュー\n\n${reviewResult}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
